<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAsTCA</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-section">
        <div class="logo-icon">G</div>
        <div class="logo-text">
          <h1>GAsTCA</h1>
          <span class="tagline">Merch Intelligence</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Connection Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot online"></span>
      <span class="status-text">Connected to MBA</span>
    </div>

    <!-- Quick Stats -->
    <section class="quick-stats">
      <div class="stat-card">
        <div class="stat-icon sales-icon">💰</div>
        <div class="stat-info">
          <span class="stat-value" id="todaySales">$0.00</span>
          <span class="stat-label">Today's Sales</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon units-icon">📦</div>
        <div class="stat-info">
          <span class="stat-value" id="todayUnits">0</span>
          <span class="stat-label">Units Sold</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon royalty-icon">👑</div>
        <div class="stat-info">
          <span class="stat-value" id="todayRoyalties">$0.00</span>
          <span class="stat-label">Royalties</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon products-icon">🎨</div>
        <div class="stat-info">
          <span class="stat-value" id="totalProducts">0</span>
          <span class="stat-label">Live Products</span>
        </div>
      </div>
    </section>

    <!-- Recent Sales -->
    <section class="recent-sales">
      <div class="section-header">
        <h3>Recent Sales</h3>
        <span class="badge" id="newSalesBadge">0 new</span>
      </div>
      <div class="sales-list" id="recentSalesList">
        <div class="empty-state">
          <span class="empty-icon">📊</span>
          <p>No sales data yet</p>
          <small>Visit your MBA dashboard to sync</small>
        </div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="quick-actions">
      <button class="action-btn" id="openDashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Full Dashboard
      </button>
      <button class="action-btn" id="openNicheResearch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        Niche Research
      </button>
      <button class="action-btn" id="openKeywords">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h10M4 17h6"/>
        </svg>
        Keywords
      </button>
      <button class="action-btn" id="openTrending">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        </svg>
        Trending
      </button>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>v1.0.0</span>
      <span>Last sync: <span id="lastSync">Never</span></span>
    </footer>
  </div>

  <script src="../libs/theme-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
